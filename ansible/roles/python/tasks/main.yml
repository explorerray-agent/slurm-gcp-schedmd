- name: Include OS Vars
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml'
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml'
  - '{{ ansible_distribution|lower }}.yml'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}.yml'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}.yml'
  - '{{ ansible_os_family|lower }}.yml'

- name: Install Packages
  package:
    name: '{{python_packages}}'
    state: present

- name: update alternatives to python38
  shell:
    cmd: alternatives --set python3 /usr/bin/python3.8
  when: python38_installed

# scripts/*.py carry '{{ python_venv }}/bin/python3' as a literal shebang, which
# cannot be templated because Terraform ships those files verbatim to running
# clusters. Catch a python_venv override here rather than at boot. The slurm role
# runs earlier in the play and has already installed the scripts.
- name: Stat Installed Scripts
  ansible.builtin.stat:
    path: /slurm/scripts/util.py
  register: python_scripts_util

- name: Read Shebang From Installed Scripts
  ansible.builtin.command:
    cmd: head -1 /slurm/scripts/util.py
  changed_when: false
  register: python_scripts_shebang
  when: python_scripts_util.stat.exists

- name: Verify Scripts Agree With python_venv
  ansible.builtin.assert:
    that: "python_scripts_shebang.stdout == '#!' ~ python_venv ~ '/bin/python3'"
    fail_msg: >-
      python_venv is '{{ python_venv }}' but /slurm/scripts/util.py starts with
      '{{ python_scripts_shebang.stdout }}'. Update every shebang under scripts/
      to match, or revert python_venv.
  when: python_scripts_util.stat.exists

# The pip module's parameters are named virtualenv/virtualenv_command for
# historical reasons, but what virtualenv_command runs here is the stdlib venv
# module. The third-party virtualenv tool is not involved and is not installed;
# see python_packages in vars/ for why python3-venv is the package needed.
- name: Create Venv
  ansible.builtin.pip:
    name: pip
    extra_args: --upgrade
    virtualenv: '{{ python_venv }}'
    virtualenv_command: '{{ python_interpreter }} -m venv --copies'

- name: Copy Pip Requirements File
  copy:
    src: slurm-gcp-requirements.txt
    dest: /tmp/slurm-gcp-requirements.txt

- name: Install Pip Packages
  pip:
    requirements: /tmp/slurm-gcp-requirements.txt
    extra_args: --upgrade
    virtualenv: '{{ python_venv }}'
    state: present
